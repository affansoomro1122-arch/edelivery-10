<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Products | BUY EV Electric Trucks</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">
</head>
<body>
<div id="site-header"></div>

<main class="page">
 <div class="wrap">
  <div class="crumbs"><a href="/">Home</a> / Products</div>
  <h2>Our <span class="ac">Products</span></h2>
  <div class="toolbar">
   <input id="q" type="search" placeholder="Search products..." aria-label="Search products">
   <select id="sort" aria-label="Sort products">
    <option value="new">Newest first</option>
    <option value="low">Price: low to high</option>
    <option value="high">Price: high to low</option>
    <option value="az">Name: A–Z</option>
   </select>
   <span class="count" id="count"></span>
  </div>
  <div class="grid" id="list"></div>
 </div>
</main>

<div id="site-footer"></div>

<script src="app.js"></script>
<script>
(function () {
  var all = [], q = document.getElementById('q'), sort = document.getElementById('sort'),
      list = document.getElementById('list'), count = document.getElementById('count');
  function draw() {
    var t = q.value.trim().toLowerCase();
    var items = all.filter(function (p) {
      var hay = (p.name + ' ' + (p.description || '') + ' ' + (p.specs || []).join(' ')).toLowerCase();
      return !t || hay.indexOf(t) > -1;
    });
    var m = sort.value;
    items.sort(function (a, b) {
      if (m === 'low') return a.price - b.price;
      if (m === 'high') return b.price - a.price;
      if (m === 'az') return a.name.localeCompare(b.name);
      return b.createdAt - a.createdAt;
    });
    count.textContent = items.length + (items.length === 1 ? ' product' : ' products');
    list.innerHTML = items.length ? items.map(SKY.cardHTML).join('') : '<p class="empty" style="grid-column:1/-1">No products match your search.</p>';
  }
  q.oninput = draw; sort.onchange = draw;
  SKY.load().then(function (d) { all = d; draw(); });
})();
</script>
</body>
</html>
